version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/orderService"
    runOptions:
      $ref: "#/components/runOptions/orderServiceTest"
    settings:
      schemaResiliencyTests: all
specmatic:
  governance:
    successCriteria:
      minCoveragePercentage: 70
      maxMissedOperationsInSpec: 4
      enforce: true
components:
  sources:
    localContracts:
      filesystem:
        directory: .
  services:
    orderService:
      description: Order Service with Multiple Auth Schemes
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localContracts"
            specs:
              - spec:
                  id: orderApiSpec
                  path: ./spec/order-api-with-auth_v2.yaml
  runOptions:
    orderServiceTest:
      openapi:
        type: test
        filter: "PATH!='/internal/metrics' && PATH!='/health'"
        baseUrl: ${APP_BASE_URL:https://localhost:8443}
        actuatorUrl: ${ACTUATOR_URL:https://localhost:8443/actuator/mappings}
        cert:
          keyStore:
            file: ${SPECMATIC_CLIENT_KEYSTORE:./certs/specmatic-client.jks}
            alias: specmatic-client
            password: ${SPECMATIC_CLIENT_KEY_PASSWORD:changeit}
          keyStorePassword: ${SPECMATIC_CLIENT_KEYSTORE_PASSWORD:changeit}
        specs:
          - spec:
              id: orderApiSpec
              securitySchemes:
                basicAuth:
                  type: basicAuth
                  token: ${BASIC_AUTH_TOKEN:dXNlcjpwYXNzd29yZA==}
                apiKeyAuth:
                  type: apiKey
                  token: ${API_KEY:APIKEY1234}
