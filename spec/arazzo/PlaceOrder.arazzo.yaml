arazzo: 1.1.0
info:
  title: Arazzo Workflow
  version: 1.0.0
sourceDescriptions:
  - name: OrderApiOauth
    url: ../order-api-with-auth_v2.yaml
    type: openapi
workflows:
  - workflowId: PlaceOrder
    inputs:
      required:
        - createOrder
        - createProduct
      type: object
      properties:
        createProduct:
          required:
            - name
            - type
            - inventory
          type: object
          properties:
            name:
              type: string
            type:
              type: string
              enum:
                - book
                - food
                - gadget
                - other
            inventory:
              type: integer
        createOrder:
          required:
            - count
            - status
          type: object
          properties:
            count:
              type: integer
            status:
              type: string
              enum:
                - fulfilled
                - pending
                - cancelled
    steps:
      - stepId: createProduct
        operationId: $sourceDescriptions.OrderApiOauth.post-products
        parameters:
          - name: Authorization
            in: header
            value: $specmatic.auth
        requestBody:
          contentType: application/json
          payload:
            name: $inputs.createProduct.name
            type: $inputs.createProduct.type
            inventory: $inputs.createProduct.inventory
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          id: $response.body.id
      - stepId: createOrder
        operationId: $sourceDescriptions.OrderApiOauth.post-orders
        parameters:
          - name: Authorization
            in: header
            value: $specmatic.auth
        requestBody:
          contentType: application/json
          payload:
            count: $inputs.createOrder.count
            status: $inputs.createOrder.status
            productid: $steps.createProduct.outputs.id
        successCriteria:
          - condition: $statusCode == 201
