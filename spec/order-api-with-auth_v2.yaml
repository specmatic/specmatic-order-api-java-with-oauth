openapi: 3.0.1
info:
  title: Order API
  description: Order API with authentication
  version: "2.0"
tags:
  - name: Order
    description: Order operations.
  - name: Product
    description: Product operations.
servers:
  - url: "http://localhost:3000"
paths:
  /health:
    get:
      summary: Health check
      description: Reports whether the service is available.
      operationId: get-health
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
      security: []
  "/products/{id}":
    parameters:
      - schema:
          type: integer
        name: id
        in: path
        required: true
        description: Identifier of the product.
        examples:
          GET_DETAILS:
            value: 10
          INVALID_ID:
            value: "344"
          DELETE_PRODUCT:
            value: 20
    get:
      summary: Fetch product details
      description: Retrieves a product by its identifier.
      tags:
        - Product
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Product"
              examples:
                GET_DETAILS:
                  value:
                    name: "XYZ Phone"
                    type: "gadget"
                    inventory: 10
                    id: 10
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "./common_response_schema.yaml#/components/schemas/BadRequestErrorResponseBody"
              examples:
                INVALID_ID:
                  value:
                    timestamp: "2023-03-17T12:06:56.177+00:00"
                    status: 404
                    error: "Not Found"
                    message: "Not found"
      operationId: get-product-id
      security:
        - basicAuth: []
    patch:
      summary: Update product details
      description: Updates an existing product by its identifier.
      operationId: patch-products-id
      tags:
        - Product
      responses:
        "200":
          description: Update successful
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
        "403":
          $ref: "./common_responses.yaml#/components/responses/Forbidden"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./common.yaml#/components/schemas/Product"
      security:
        - oAuth2AuthCode: ["product:create"]
    delete:
      summary: Delete a product
      description: Deletes an existing product by its identifier.
      operationId: delete-products-id
      tags:
        - Product
      responses:
        "200":
          description: Deletion successful
          content:
            text/plain:
              schema:
                type: string
              examples:
                DELETE_PRODUCT:
                  value: "success"
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
      security:
        - apiKeyAuth: []
  /products:
    get:
      summary: GET Products based on type
      description: Returns products filtered by the requested criteria.
      operationId: get-products
      tags:
        - Product
      parameters:
        - name: type
          in: query
          description: Filter products by product type.
          schema:
            type: string
            enum:
              - gadget
              - book
              - food
              - other
      responses:
        "200":
          description: List of products in the response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./common.yaml#/components/schemas/Product"
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
      security:
        - basicAuth: []
    post:
      summary: POST /products
      description: Creates a new product.
      operationId: post-products
      tags:
        - Product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./common.yaml#/components/schemas/ProductDetails"
      responses:
        "201":
          description: POST /products
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ProductId"
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
        "403":
          $ref: "./common_responses.yaml#/components/responses/Forbidden"
      security:
        - oAuth2AuthCode: ["product:create"]
  /orders:
    get:
      summary: Search for orders
      operationId: get-orders
      tags:
        - Order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./common.yaml#/components/schemas/Order"
              examples:
                200_OK:
                  value:
                    - productid: 10
                      count: 2
                      status: "pending"
                      id: 10
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
      parameters:
        - schema:
            type: integer
          in: query
          name: productid
          description: Filter orders by product identifier.
          examples:
            200_OK:
              value: 10
        - schema:
            type: string
          in: query
          name: status
          description: Filter orders by fulfillment status.
          examples:
            200_OK:
              value: fulfilled
      description: Returns orders matching the supplied query filters.
      security:
        - basicAuth: []
    post:
      summary: POST /orders
      description: Creates a new order.
      operationId: post-orders
      tags:
        - Order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./common.yaml#/components/schemas/OrderDetails"
      responses:
        "201":
          description: POST /orders
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/OrderId"
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
        "403":
          $ref: "./common_responses.yaml#/components/responses/Forbidden"
      security:
        - oAuth2AuthCode: ["order:create"]
  "/orders/{id}":
    parameters:
      - schema:
          type: integer
        name: id
        in: path
        required: true
        description: Identifier of the order.
        examples:
          DETAILS:
            value: 10
          INVALID_ID:
            value: 433
    get:
      summary: Fetch order details
      tags:
        - Order
      description: Retrieves an order by its identifier.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Order"
              examples:
                DETAILS:
                  value:
                    productid: 10
                    count: 2
                    status: "pending"
                    id: 10
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "./common_response_schema.yaml#/components/schemas/BadRequestErrorResponseBody"
              examples:
                INVALID_ID:
                  value:
                    timestamp: "2023-03-17T12:06:56.177+00:00"
                    status: 404
                    error: "Not Found"
                    message: "Product with id 344 was not found"
      operationId: get-orders-id
      parameters: []
      security:
        - basicAuth: []
    patch:
      summary: Update order details
      description: Updates an existing order by its identifier.
      operationId: patch-orders-id
      tags:
        - Order
      responses:
        "200":
          description: Success
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
        "403":
          $ref: "./common_responses.yaml#/components/responses/Forbidden"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./common.yaml#/components/schemas/Order"
      security:
        - oAuth2AuthCode: ["order:create"]
    delete:
      summary: Cancel an order
      description: Cancels an existing order by its identifier.
      operationId: delete-orders-id
      tags:
        - Order
      responses:
        "200":
          description: Cancel successful
          content:
            text/plain:
              schema:
                type: string
              examples:
                DELETE_ORDER:
                  value: "success"
        "401":
          $ref: "./common_responses.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common_responses.yaml#/components/responses/BadRequest"
      security:
        - apiKeyAuth: []
components:
  schemas:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic Authentication with username and password
    oAuth2AuthCode:
      type: oauth2
      description: keycloak based oauth security example
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8083/realms/specmatic/protocol/openid-connect/auth
          tokenUrl: http://localhost:8083/realms/specmatic/protocol/openid-connect/token
          scopes:
            email: email
            order:create: Create and update orders
            product:create: Create and update products
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key based authentication
