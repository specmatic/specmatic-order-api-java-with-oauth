services:
  cert-generator:
    image: eclipse-temurin:21-jdk-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache bash openssl
        rm -f /certs/.ready
        bash /scripts/generate_demo_certificates.sh /certs
        touch /certs/.ready
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/certs/.ready"]
      interval: 1s
      timeout: 1s
      retries: 30
    volumes:
      - ./scripts:/scripts:ro
      - ./build/certs:/certs

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    command: start-dev --import-realm
    environment:
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/specmatic-realm.json
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8083:8080"

  order-api:
    image: specmaticdemo/specmatic-order-api-java-with-oauth:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      cert-generator:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/specmatic
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: order-api
      SERVER_SSL_KEY_STORE: file:/certs/server-keystore.jks
      SERVER_SSL_KEY_STORE_PASSWORD: changeit
      SERVER_SSL_KEY_PASSWORD: changeit
      SERVER_SSL_TRUST_STORE: file:/certs/server-truststore.jks
      SERVER_SSL_TRUST_STORE_PASSWORD: changeit
      SERVER_SSL_CLIENT_AUTH: need
    volumes:
      - ./build/certs:/certs:ro
    ports:
      - "8080:8080"
    restart: on-failure

  specmatic-test:
    image: specmatic/enterprise:latest
    depends_on:
      order-api:
        condition: service_started
    working_dir: /usr/src/app
    environment:
      APP_BASE_URL: https://order-api:8080
      ACTUATOR_URL: https://order-api:8080/actuator/mappings
      SPECMATIC_CLIENT_KEYSTORE: /usr/src/app/build/certs/specmatic-client.jks
      SPECMATIC_CLIENT_KEYSTORE_PASSWORD: changeit
      SPECMATIC_CLIENT_KEY_PASSWORD: changeit
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_USER_USERNAME: user1
      KEYCLOAK_USER_PASSWORD: password
      KEYCLOAK_SERVICE_ACCOUNT_USERNAME: service_account
      KEYCLOAK_SERVICE_ACCOUNT_PASSWORD: SvcAcct-Products!2026
    volumes:
      - .:/usr/src/app
    entrypoint: ["/bin/bash"]
    command:
      - -ec
      - |
        set -euo pipefail

        bash scripts/wait_for_http.sh \
          "http://keycloak:8080/realms/specmatic/.well-known/openid-configuration" \
          "Keycloak" \
          90 \
          2
        bash scripts/wait_for_http.sh \
          "https://order-api:8080/health" \
          "Order API" \
          90 \
          2 \
          "200" \
          --cacert build/certs/ca.crt \
          --cert build/certs/specmatic-client.crt \
          --key build/certs/specmatic-client.key
        specmatic test --filter="PATH!='/health'"
